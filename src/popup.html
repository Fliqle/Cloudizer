<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 14px/1.4 -apple-system, "Segoe UI", system-ui, Arial, sans-serif;
        color: #2c2d2e;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0;
      }
      .status {
        font-size: 13px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #f6f7f8;
        color: #87898f;
      }
      .status.ok {
        background: #e7f6ee;
        color: #1d7a4d;
      }
      .status.warn {
        background: #fdeaea;
        color: #c02b2b;
      }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 9px;
        border: 1px solid rgba(0, 16, 61, 0.1);
        border-radius: 9px;
        background: #0077ff;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      /* переключатель */
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #c4c8cf;
        border-radius: 22px;
        transition: 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: 0.15s;
      }
      input:checked + .slider {
        background: #0077ff;
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
    </style>
  </head>
  <body>
    <h2>Сохранение изображений</h2>

    <div class="row">
      <span>Кнопка на картинках</span>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <div id="status" class="status">Загрузка…</div>

    <button id="open">Открыть настройки</button>

    <script src="popup.js"></script>
  </body>
</html>
