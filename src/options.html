<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Настройки Cloudizer</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Cloudizer</h1>
      <p class="sub">Сохраняйте понравившиеся картинки с сайтов в облако или локально</p>

      <form id="form">
        <fieldset class="destination">
          <legend>Куда сохранять</legend>
          <label class="destination-option destination-option-cloud">
            <input id="destinationCloud" name="destination" type="radio" value="cloud" checked />
            <span><b>Облако Mail</b><small>Загрузка через WebDAV</small></span>
          </label>
          <label class="destination-option">
            <input id="destinationLocal" name="destination" type="radio" value="local" />
            <span><b>На компьютер</b><small>В папку «Загрузки»</small></span>
          </label>
        </fieldset>

        <div id="cloudSettings">
          <label class="field">
            <span>Email</span>
            <input id="email" type="email" placeholder="valera@mail.ru" autocomplete="username" />
          </label>

          <label class="field">
            <span>Пароль для внешнего приложения</span>
            <input id="appPassword" type="password" autocomplete="current-password" />
            <small>
              Это не основной пароль от почты. Создайте его в
              <a href="https://account.mail.ru/user/2-step-auth/passwords/" target="_blank" rel="noopener"
                >настройках Mail ID → Пароли для внешних приложений</a
              >
              (<a href="https://help.mail.ru/id/settings/2fa/apps" target="_blank" rel="noopener">инструкция</a>;
              нужен привязанный телефон).
            </small>
          </label>
        </div>

        <label class="field folder-field">
          <span id="folderLabel">Папка в Облаке</span>
          <input id="folder" type="text" placeholder="Сохраненные картинки" />
          <small id="folderHint">Папка создастся автоматически, если её ещё нет.</small>
        </label>

        <div class="field categories-field">
          <span>Категории (подпапки)</span>
          <div id="categoryTags" class="category-tags" aria-live="polite"></div>
          <div class="category-create">
            <input id="categoryInput" type="text" placeholder="Название папки" maxlength="180" />
            <button type="button" id="addCategory" class="secondary">Добавить</button>
          </div>
        </div>

        <label class="check">
          <input id="enabled" type="checkbox" />
          <span class="check-control" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.333 4L6 11.333L2.667 8" />
            </svg>
          </span>
          <span>Показывать иконку на картинках</span>
        </label>

        <div class="actions">
          <button type="submit" class="primary">Сохранить</button>
          <button type="button" id="test" class="subtle">Проверить подключение</button>
        </div>

        <div id="status" class="status" hidden></div>
      </form>

    </main>

    <script src="options.js"></script>
  </body>
</html>
